name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node addon/build.mjs
      - run: |
          for type in deeprecall-basic deeprecall-cloze; do
            for file in front.html back.html style.css; do
              cp "dist/$type/$file" "$type-$file"
            done
          done
          gh release create "$GITHUB_REF_NAME" addon/deeprecall.ankiaddon \
            deeprecall-basic-front.html deeprecall-basic-back.html deeprecall-basic-style.css \
            deeprecall-cloze-front.html deeprecall-cloze-back.html deeprecall-cloze-style.css \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
