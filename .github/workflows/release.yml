name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node addon/build.mjs
      - run: |
          gh release create "$GITHUB_REF_NAME" addon/deeprecall.ankiaddon \
            dist/front.html dist/back.html dist/style.css --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
